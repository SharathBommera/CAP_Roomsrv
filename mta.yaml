_schema-version: 3.3.0
ID: roomsrv
description: A simple CAP project.
version: 1.0.0
modules:
- name: roomsrv-srv
  type: nodejs
  path: gen/srv
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: roomsrv-destination-content
  type: com.sap.application.content
  requires:
  - name: roomsrv-destination-service
    parameters:
      content-target: true
  - name: roomsrv_html_repo_host
    parameters:
      service-key:
        name: roomsrv_html_repo_host-key
  - name: uaa_roomsrv
    parameters:
      service-key:
        name: uaa_roomsrv-key
  parameters:
    content:
      instance:
        destinations:
        - Name: roomsrvapprouter_roomsrv_html_repo_host
          ServiceInstanceName: roomsrv-html5-app-host-service
          ServiceKeyName: roomsrv_html_repo_host-key
          sap.cloud.service: roomsrvapprouter
        - Authentication: OAuth2UserTokenExchange
          Name: roomsrvapprouter_uaa_roomsrv
          ServiceInstanceName: roomsrv-xsuaa-service
          ServiceKeyName: uaa_roomsrv-key
          sap.cloud.service: roomsrvapprouter
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
resources:
- name: roomsrv-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      version: 1.0.0
    service: destination
    service-name: roomsrv-destination-service
    service-plan: lite
- name: roomsrv_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: roomsrv-html5-app-host-service
    service-plan: app-host
- name: uaa_roomsrv
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: roomsrv-xsuaa-service
    service-plan: application
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
